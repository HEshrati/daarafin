services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    env_file: .env
    volumes: [minio-data:/data]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 5s, retries: 10}
  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    volumes: ["./scripts/init-minio.sh:/scripts/init-minio.sh:ro"]
  web: &backend
    build: .
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
  worker:
    <<: *backend
    ports: []
    environment:
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "config", "worker", "-Q", "financial-critical,integrations,documents,notifications", "-l", "INFO"]
  beat:
    <<: *backend
    ports: []
    environment:
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
volumes: {postgres-data: {}, redis-data: {}, minio-data: {}}
