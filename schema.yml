components:
  schemas:
    BankAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        iban:
          type: string
          maxLength: 26
        is_active:
          type: boolean
      required:
      - iban
      - id
    Bulk:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - rows
    Case:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CaseStatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        requested_by:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - reason
      - requested_by
      - reviewed_by
      - status
      - updated_at
    CaseStatusEnum:
      enum:
      - draft
      - submitted
      - under_review
      - need_changes
      - approved
      - rejected
